            --argjson context_rereviews "$context_rereviews" \
            --argjson context_files "$context_files" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --argjson chunk_count "$EXPECTED_CHUNK_COUNT" \
            --arg chunk_manifest_sha256 "$EXPECTED_CHUNK_MANIFEST_SHA256" \
            --arg compaction_manifest_sha256 "$EXPECTED_COMPACTION_MANIFEST_SHA256" \
            --arg exact_diff_sha256 "$EXPECTED_DIFF_SHA256" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg merge_tree_sha "$EXPECTED_MERGE_TREE_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg review_representation_sha256 "$EXPECTED_REPRESENTATION_SHA256" \
            --arg response_manifest_b64 "$EXPECTED_RESPONSE_MANIFEST_B64" \
            --arg response_manifest_sha256 "$EXPECTED_RESPONSE_MANIFEST_SHA256" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              chunk_count: $chunk_count,
              chunk_manifest_sha256: $chunk_manifest_sha256,
              compaction_manifest_sha256: $compaction_manifest_sha256,
              exact_diff_sha256: $exact_diff_sha256,
              head_sha: $head_sha,
              merge_tree_sha: $merge_tree_sha,
              model: $model,
              review_representation_sha256: $review_representation_sha256,
              response_manifest_b64: $response_manifest_b64,
              response_manifest_sha256: $response_manifest_sha256,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "PASS",
              partial_coverage: $partial_coverage,
              partial_coverage_chunks: $partial_coverage_chunks,
              security_rereviews: $security_rereviews,
              security_rereview_outcomes: {
                cleared: $security_rereviews_cleared,
                unresolved: $security_rereviews_unresolved,
                failed: $security_rereviews_failed
              },
              context_rereviews: $context_rereviews,
              context_rereview_outcomes: {
                cleared: $context_rereviews,
                unresolved: 0,
                failed: 0
              },
              context_files: $context_files,
              merge_authority: "none"
            }
          ')"
          evidence_marker=claude-review-evidence:v3
          if [ "${EXPECTED_RESPONSE_TRANSPORT:-inline-v3}" = "review-response-artifact/v1" ]; then
            evidence="$(jq -c --slurpfile transport "${response_manifest%.json}.transport.json" \
              'del(.response_manifest_b64) | .response_transport = $transport[0]' <<<"$evidence")"
            evidence_marker=claude-review-evidence:v3-artifact-v1
          fi
          visible_body=""
          else



          [[ "$OBJECTION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test "${#OBJECTION_B64}" -le 60000
          decoded_objection_file="$RUNNER_TEMP/published-objection.decoded"
          objection_file="$RUNNER_TEMP/published-objection.txt"
          printf '%s' "$OBJECTION_B64" | base64 -d > "$decoded_objection_file"
          tr -cd '\11\12\40-\176' \
            < "$decoded_objection_file" > "$objection_file"
          test -s "$objection_file"
          objection="$(cat "$objection_file")"
          # THE HIDDEN COMMENT IS AN HTML COMMENT, AND `-->` ENDS ONE.






          published_objection_b64="$(base64 -w0 "$objection_file")"
          evidence="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --arg failure_stage "$FAILURE_STAGE" \
            --arg objection_b64 "$published_objection_b64" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              head_sha: $head_sha,
              model: $model,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "FAIL",
              failure_stage: $failure_stage,
              objection_b64: $objection_b64,
              merge_authority: "none"
            }
          ')"

          markdown_fence() {
            local file="$1"
            local longest
            longest="$(awk '{
              run = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "`") {
                  run++
                  if (run > max) max = run
                } else {
                  run = 0
                }
              }
            } END { print max + 0 }' "$file")"
            [ -n "$longest" ] || longest=0
            local width=3
            if [ "$longest" -ge 3 ]; then
              width=$((longest + 1))
            fi
            printf '%*s' "$width" '' | tr ' ' '`'
          }

          objection_fence="$(markdown_fence "$objection_file")"

          visible_body="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n%s\n\n' \
            '### Adversarial review: FAIL' \
            'The reviewer read this change and objected. This comment is **advisory** and confers **no merge authority**; it is evidence, not a decision.' \
            "Reviewed head \`${EXPECTED_HEAD_SHA}\` against base \`${EXPECTED_BASE_REF}\`, model \`${EXPECTED_MODEL}\`, [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "$objection_fence" \
            "$objection" \
            "$objection_fence")"
          fi
          evidence_marker="${evidence_marker:-claude-review-evidence:v3}"
          bdir="$RUNNER_TEMP/review-evidence-bundle"
          install -d -m 0700 "$bdir"
          printf '%s\n' "$evidence" > "$bdir/bundle.json"
          pending_evidence="$(jq -c '.verdict = "PENDING"' <<<"$evidence")"
          pending_body="<!-- ${evidence_marker} ${pending_evidence} -->"






          visible_separator=""
          [ -z "$visible_body" ] || visible_separator=$'\n\n'
          pass_body="${visible_body}${visible_separator}<!-- ${evidence_marker} ${evidence} -->"
          test "$(printf '%s' "$pending_body" | wc -c)" -le 65536
          test "$(printf '%s' "$pass_body" | wc -c)" -le 65536


          for boundary_checked in "$pending_evidence" "$evidence"; do
            case "$boundary_checked" in
              *'-->'*)
                echo "Adversarial review publication failed assertion: evidence JSON contains an HTML comment terminator" >&2
                exit 1
                ;;
            esac
          done

          bounded_gh() {
            timeout --kill-after=5s 20s gh api "$@"
          }

          validate_live_controls() {
            local phase="$1"
            local pr_file="$RUNNER_TEMP/${phase}-pull-request.json"
            local ref_file="$RUNNER_TEMP/${phase}-protected-ref.json"
            local run_file="$RUNNER_TEMP/${phase}-workflow-run.json"
            local state head_ref
            bounded_gh "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              > "$pr_file" || return 1



            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg base_ref "$EXPECTED_BASE_REF" \
              --arg head "$EXPECTED_HEAD_SHA" \
              --arg base_ref_admitted "$base_ref_admitted_via" '
              .state == "open"
              and .draft == false
              and .base.ref == $base_ref
              and ( .base.ref == .base.repo.default_branch
          or $base_ref_admitted == "configured-allowlist" )
              and .head.repo.full_name == $repository
              and .head.sha == $head
              and all(.labels[]; .name != "do-not-merge")
            ' "$pr_file" >/dev/null || return 1


            head_ref="$(jq -er .head.ref "$pr_file")" || return 1
            test -n "$head_ref" || return 1
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${EXPECTED_BASE_REF}" \
              > "$ref_file" || return 1
            jq -e \
              --arg ref "refs/heads/${EXPECTED_BASE_REF}" \
              --arg base "$EXPECTED_BASE_SHA" '
              .ref == $ref
              and .object.type == "commit"
              and .object.sha == $base
            ' "$ref_file" >/dev/null || return 1
            if [ "$base_ref_admitted_via" = "configured-allowlist" ]; then
              local live_default_head
              live_default_head="$(bounded_gh \
                "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
                --jq '.object.sha')" || return 1
              [[ "$live_default_head" =~ ^[0-9a-f]{40}$ ]] || return 1
              test "$GITHUB_WORKFLOW_SHA" = "$live_default_head" || return 1
            fi
            bounded_gh "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > "$run_file" || return 1
            jq -e \
              --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg head_ref "$head_ref" \
              --arg head "$EXPECTED_HEAD_SHA" '
              .id == $run_id
              and .run_attempt == $run_attempt
              and .event == "pull_request_target"
              and .head_branch == $head_ref
              and .head_sha == $head
              and .path == ".github/workflows/claude-pr-review.yml"
              and .status == "in_progress"
              and .conclusion == null
            ' "$run_file" >/dev/null || return 1
            state="$(curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --max-redirs 2 \
              --max-time 15 --retry 2 --retry-max-time 60 \
              https://raw.githubusercontent.com/jbutler1980/agent-ops-flags/main/state \
              | tr -d '[:space:]')" || return 1
            test "$state" = "on" || return 1
          }

          fetch_comment() {
            local output="$1"
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              > "$output"
            test "$(wc -c < "$output")" -le 131072
          }

          validate_comment() {
            local input="$1"
            local expected_body="$2"
            jq -e \
              --argjson id "$comment_id" \
              --arg body "$expected_body" '
              .id == $id and .body == $body
            ' "$input" >/dev/null
          }

          patch_comment() {
            local body="$1"
            local output="$2"
            bounded_gh -X PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" > "$output" \
              && test "$(wc -c < "$output")" -le 131072 \
              && validate_comment "$output" "$body"
          }

          restore_pending() {
            local recovery="$RUNNER_TEMP/restore-pending.json"
            for _ in 1 2 3; do
              if patch_comment "$pending_body" "$recovery"; then
                return 0
              fi
              if fetch_comment "$recovery" \
                && validate_comment "$recovery" "$pending_body"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          validate_live_controls pre
          created="$RUNNER_TEMP/pending-comment.json"
          bounded_gh -X POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$pending_body" > "$created"
          test "$(wc -c < "$created")" -le 131072
          comment_id="$(jq -er .id "$created")"
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          validate_comment "$created" "$pending_body"

          validate_live_controls publish
          pass_response="$RUNNER_TEMP/pass-comment.json"
          if ! patch_comment "$pass_body" "$pass_response"; then
            recovered="$RUNNER_TEMP/pass-recovery.json"
            fetch_comment "$recovered"
            if validate_comment "$recovered" "$pending_body"; then
              exit 1
            fi
            validate_comment "$recovered" "$pass_body"
          fi

          final_comment="$RUNNER_TEMP/final-comment.json"
          final_liveness_status=0
          validate_live_controls final || final_liveness_status=$?
          if [ "$final_liveness_status" -eq 0 ] \
            && fetch_comment "$final_comment" \
            && validate_comment "$final_comment" "$pass_body"; then
            exit 0
          fi

          echo "Post-publication validation failed; compensating PASS evidence." >&2
          if restore_pending; then
            exit 1
          fi
          for _ in 1 2 3; do
            if bounded_gh -X DELETE \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"; then
              exit 1
            fi
            sleep 1
          done
          echo "Unable to confirm compensation or deletion of published PASS evidence." >&2
          exit 1

      - name: Upload evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-evidence-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-evidence-bundle/bundle.json
          if-no-files-found: error
          retention-days: 90
