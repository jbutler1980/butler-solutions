            if ! jq -jcS '.choices[0].message.content | fromjson | del(.missing_context)' \
              "$response" > "$canonical_result" 2>/dev/null; then
              echo "Failed to materialize the canonical chunk response." >&2
              record_failure_stage "chunk-schema" \
                "chunk=${index}/${chunk_count} phase=canonicalize"
              exit 1
            fi
            chmod 0600 "$canonical_result"
            completion_tokens="$(jq -er .usage.completion_tokens "$response")"
            completion_tokens=$((completion_tokens + adjudication_extra_tokens))
            canonical_content_bytes="$(wc -c < "$canonical_result")"
            canonical_content_sha256="$(sha256sum "$canonical_result" | cut -d' ' -f1)"
            result="$result_dir/$(printf '%04d' "$index").json"
            if ! jq -cS \
              --argjson completion_tokens "$completion_tokens" \
              --argjson canonical_content_bytes "$canonical_content_bytes" \
              --arg canonical_content_sha256 "$canonical_content_sha256" \
              --arg chunk_sha256 "$chunk_sha256" '
              .choices[0].message.content
              | fromjson
              | del(.chunk_nonce, .missing_context)
              | .chunk_sha256 = $chunk_sha256
              | .completion_tokens = $completion_tokens
              | .canonical_content_bytes = $canonical_content_bytes
              | .canonical_content_sha256 = $canonical_content_sha256
            ' "$response" > "$result" 2>/dev/null; then
              echo "Failed to materialize the validated chunk response." >&2
              record_failure_stage "chunk-schema" \
                "chunk=${index}/${chunk_count} phase=materialize"
              exit 1
            fi
            chmod 0600 "$result"
            content_security=false
            if chunk_touches_security "$chunk" "$chunk_paths"; then
              content_security=true
            fi



            security_result="$result.security"
            jq -cS --argjson content_security "$content_security" '
              .security_partial = (
                .coverage_complete == false
                and .verdict == "pass"
                and .injection_detected == false
                and ($content_security
          or any(.interface_facts[];
          .kind == "auth" or .role == "guards"
          or .role == "removes"))
              )
            ' "$result" > "$security_result"
            mv -- "$security_result" "$result"
            chmod 0600 "$result"
            security_partial="$(jq -r .security_partial "$result")"
            if [ "$security_partial" = "true" ]; then
              if [ "$rereview_pass" -eq 0 ]; then
                printf 'Adversarial review chunk %s/%s: coverage_complete=false with security-relevant interface facts; running one security re-review before deciding\n' \
                  "$index" "$chunk_count" >&2
                security_rereviews=$((security_rereviews + 1))
                rereview_pass=1
                rereview_context_primary=""
                if jq -e '(.missing_context | length) > 0' "$context_primary" >/dev/null; then
                  rereview_context_primary="$RUNNER_TEMP/rereview-primary-${index}.json"
                  cp -- "$context_primary" "$rereview_context_primary"
                fi


                index=$((index - 1))
                continue
              fi
              security_partial_unresolved=$((security_partial_unresolved + 1))
              if [ -n "$rereview_context_primary" ]; then
                context_rereviews_unresolved=$((context_rereviews_unresolved + 1))
                context_rereviews_security=$((context_rereviews_security + 1))
              fi
              printf 'Adversarial review chunk %s/%s: coverage_complete=false on a security-relevant interface could not be resolved by the security re-review\n' \
                "$index" "$chunk_count" >&2
