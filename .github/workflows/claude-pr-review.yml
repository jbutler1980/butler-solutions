              record_failure_stage "kill-switch" "state=unreadable"
              return 1
            fi
            if [ "$state" != "on" ]; then
              echo "Kill switch is not 'on'; not calling the model." >&2
              record_failure_stage "kill-switch" "state=off"
              return 1
            fi
            return 0
          }

          record_primary_fingerprint_request() {
            local fingerprint_request_meta="$RUNNER_TEMP/primary-fingerprint-request-meta.json"
            jq -c 'try (.input[1].content | split("\nUNTRUSTED_")[0] | ltrimstr("META=") | fromjson) catch {}' \
              "$1" > "$fingerprint_request_meta"
            if jq -e '(.primary_fingerprints // [] | length) > 0' "$fingerprint_request_meta" >/dev/null; then
              test -f "$primary_fingerprint_requests" && test ! -L "$primary_fingerprint_requests" || return 1
              jq -c --arg wire "$(sha256sum "$1" | cut -d' ' -f1)" --arg http "$2" \
                '{chunk_index:.chunk.index,chunk_nonce:.chunk.nonce,wire_sha256:$wire,http_status:$http}' \
                "$fingerprint_request_meta" >> "$primary_fingerprint_requests" || return 1
              test "$(wc -c < "$primary_fingerprint_requests")" -le 32768 || return 1
            fi
          }

          retain_response_diagnostic() {
            if ! python3 "$retention_helper" "$1" "$2" "$3" "$RUNNER_TEMP" "${4:-70000}"; then
              echo "Restricted response diagnostic retention failed; review cannot authorize." >&2
              (set -o noclobber; : > "$retention_failed") 2>/dev/null || return 1
              return 1
            fi
          }

          call_models() {
            local request="$1"
            local response="$2"


            local non_authoritative_confirmation="${3:-0}"
            local wire_limit="${4:-70000}"
            case "$wire_limit" in 70000|131072|147456|163840) ;; *) return 1 ;; esac
            local headers="${response}.headers"
            local wire_request="${response}.wire-request"
            local raw_response="${response}.raw"
            local attempt status retry_after delay parser_status
