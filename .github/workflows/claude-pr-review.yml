           for tree_sha, path, line_number in anchors:
            grouped.setdefault((tree_sha, path), set()).add(line_number)
           records: list[dict[str, object]] = []
           for (tree_sha, path), numbers in sorted(grouped.items()):
            ordered = sorted(numbers)
            clusters: list[list[int]] = []
            for number in ordered:
             if not clusters or number > clusters[-1][-1] + 16:
              clusters.append([number])
             else:
              clusters[-1].append(number)
            for cluster in clusters:
             first, last = cluster[0], cluster[-1]
