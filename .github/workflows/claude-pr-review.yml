          markdown_fence() {
            local file="$1"
            local longest
            longest="$(awk '{
              run = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "`") {
                  run++
                  if (run > max) max = run
                } else {
                  run = 0
                }
              }
            } END { print max + 0 }' "$file")"
            [ -n "$longest" ] || longest=0
            local width=3
            if [ "$longest" -ge 3 ]; then
              width=$((longest + 1))
            fi
            printf '%*s' "$width" '' | tr ' ' '`'
          }

