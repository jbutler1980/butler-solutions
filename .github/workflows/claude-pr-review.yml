            # This line used to say "reproduced by the confirmation sample"
            printf 'Adversarial review synthesis failed on merit: verdict=%s, confirmation_sample=%s.\n' \
              "$synthesis_verdict" "$synthesis_confirm_outcome" >&2
          fi


          if [ "$chunk_merit_failures" -gt 0 ]; then
            merit_failed_scopes+=("chunks")
            {
              printf 'REVIEWED AND FAILED -- unresolved chunk merit findings.\n'
              printf 'synthesis verdict: %s; dissenting chunks: %s\n' \
                "$synthesis_verdict" "$chunk_merit_failures"
              jq -r '.[] | select(.verdict != "pass")
                | "  chunk \(.chunk_index): \(.verdict) - \(.summary)"' \
                "$chunk_summaries"
            } >> "$OBJECTION_FILE"
            while IFS= read -r failed_chunk; do
              printf 'Adversarial review chunk %s/%s: fail\n' \
                "$failed_chunk" "$chunk_count" >&2
            done < <(jq -r '.[] | select(.verdict != "pass") | .chunk_index' \
              "$chunk_summaries")
          fi



          if [ "${#merit_failed_scopes[@]}" -gt 0 ]; then
            report_merit_failures "$synthesis_confirm_outcome"
            record_failure_stage "merit"
            if [ -n "${GITHUB_OUTPUT:-}" ] && [ ! -L "$GITHUB_OUTPUT" ]; then
              {
                echo "verdict=fail"
                echo "injection-detected=${synthesis_injection}"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          if [ "$security_partial_unresolved" -gt 0 ]; then
            printf 'Adversarial review: %s chunk(s) reported partial coverage on a security-relevant interface that could not be resolved by the security re-review; the reviewer cannot conclude.\n' \
              "$security_partial_unresolved" >&2
            record_failure_stage "coverage-unresolved"
            exit 1
          fi
          if [ "$partial_coverage" != "false" ]; then
            printf 'Adversarial review: partial coverage on %s chunk(s) recorded as advisory evidence (no security-relevant interface was left unresolved)\n' \
              "$partial_coverage_chunks" >&2
          fi
          test "$merit_confirmations" -eq "$merit_disagreements"

          compact_review_manifest="$RUNNER_TEMP/adversarial-review-compact.json"
          jq -cS \
            --argjson merit_confirmations "$merit_confirmations" \
            --argjson merit_disagreements "$merit_disagreements" '
            del(.chunk_reviews)
            | .merit_confirmations = $merit_confirmations
            | .merit_disagreements = $merit_disagreements
          ' "$review_manifest" > "$compact_review_manifest"
          review_transcript_gzip="$RUNNER_TEMP/adversarial-review-transcript.gz"
          gzip -n -9 -c "$review_transcript" > "$review_transcript_gzip"
          review_transcript_gzip_bytes="$(wc -c < "$review_transcript_gzip")"
          test "$review_transcript_gzip_bytes" -le 24000 \
            || fail_aggregate_assertion "review_transcript_gzip_bytes=${review_transcript_gzip_bytes} (limit 24000)"
          review_transcript_gzip_sha256="$(
            sha256sum "$review_transcript_gzip" | cut -d' ' -f1
          )"
          review_transcript_gzip_b64="$RUNNER_TEMP/adversarial-review-transcript.b64"
          base64 -w0 "$review_transcript_gzip" > "$review_transcript_gzip_b64"

          if [ -e "$retention_failed" ]; then
            record_failure_stage "response-retention"
            exit 1
          fi
          response_manifest="$RUNNER_TEMP/adversarial-review-response-manifest.json"
          jq -cS -n \
            --slurpfile review "$compact_review_manifest" \
            --rawfile review_transcript_gzip_b64 "$review_transcript_gzip_b64" \
            --argjson review_transcript_gzip_bytes \
              "$review_transcript_gzip_bytes" \
            --arg review_transcript_gzip_sha256 \
              "$review_transcript_gzip_sha256" \
            --rawfile interface_ledger "$interface_ledger" \
            --slurpfile synthesis "$synthesis_result" '
            {
              review: $review[0],
              review_transcript_compression: "gzip-n-9",
              review_transcript_gzip_b64: $review_transcript_gzip_b64,
              review_transcript_gzip_bytes: $review_transcript_gzip_bytes,
              review_transcript_gzip_sha256: $review_transcript_gzip_sha256,
              interface_ledger: $interface_ledger,
              synthesis: $synthesis[0]
            }
          ' > "$response_manifest"
          chmod 0600 "$response_manifest"
          python3 "$context_helper" verify "$response_manifest"
          response_manifest_bytes="$(wc -c < "$response_manifest")"
          response_capacity="$(python3 "$context_helper" response-limit "$compact_review_manifest")"
          test "$response_manifest_bytes" -le "$response_capacity" \
            || fail_aggregate_assertion "response_manifest_bytes=${response_manifest_bytes} (limit ${response_capacity})"
          response_transport=inline-v3
          if [ "$response_manifest_bytes" -gt 45000 ]; then
            response_transport=review-response-artifact/v1
            response_dir="$RUNNER_TEMP/review-response-manifest"
            install -d -m 0700 "$response_dir"
            python3 - "$response_manifest" "$response_dir/response-manifest.json" "$response_capacity" <<'PY_BINDING'
          import json, os, sys
          from pathlib import Path
          response = json.loads(Path(sys.argv[1]).read_bytes())
          response["transport_binding"] = {
              "protocol": "review-response-artifact/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["GITHUB_REPOSITORY_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "producer_revision": os.environ["GITHUB_WORKFLOW_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "producer_job": "claude-review",
              "base_sha": os.environ["EXPECTED_BASE_SHA"],
              "head_sha": os.environ["EXPECTED_HEAD_SHA"],
              "merge_tree_sha": os.environ["EXPECTED_MERGE_TREE_SHA"],
              "workflow_sha256": os.environ["EXPECTED_WORKFLOW_SHA256"],
          }
          body = json.dumps(response, sort_keys=True, separators=(",", ":")).encode()
          if len(body) > int(sys.argv[3]):
              raise ValueError("artifact response capacity")
          Path(sys.argv[2]).write_bytes(body)
          PY_BINDING
            response_manifest="$response_dir/response-manifest.json"
            chmod 0600 "$response_manifest"
            python3 "$context_helper" verify "$response_manifest"
          fi
          {
            echo "verdict=pass"
            echo "injection-detected=false"
            echo "model=$MODEL"
            echo "response-transport=$response_transport"
            if [ "$response_transport" = "inline-v3" ]; then
              echo "response-manifest-b64=$(base64 -w0 "$response_manifest")"
            else
              echo "response-manifest-bytes=$(wc -c < "$response_manifest")"
            fi
            echo "response-manifest-sha256=$(sha256sum "$response_manifest" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bounded response manifest
        id: response_artifact
        if: steps.claude.outcome == 'success' && steps.claude.outputs.response-transport == 'review-response-artifact/v1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-response-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-response-manifest/response-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Enforce exact advisory pass verdict
        id: verdict
        if: always()
        env:
          CLAUDE_FAILURE_DETAIL: ${{ steps.claude.outputs.failure-detail }}
          CLAUDE_FAILURE_STAGE: ${{ steps.claude.outputs.failure-stage }}
          CHUNKS_FAILURE_DETAIL: ${{ steps.chunks.outputs.failure-detail }}
          CHUNKS_FAILURE_STAGE: ${{ steps.chunks.outputs.failure-stage }}
          SOURCE_FAILURE_DETAIL: ${{ steps.source.outputs.failure-detail }}
          SOURCE_FAILURE_STAGE: ${{ steps.source.outputs.failure-stage }}
          CLAUDE_OBJECTION_B64: ${{ steps.claude.outputs.objection-b64 }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EXPECTED_BASE_REF: ${{ steps.source.outputs.base-ref }}
          EXPECTED_BASE_SHA: ${{ steps.source.outputs.base-sha }}
          EXPECTED_CHUNK_COUNT: ${{ steps.chunks.outputs.chunk-count }}
          EXPECTED_CHUNK_MANIFEST_SHA256: ${{ steps.chunks.outputs.chunk-manifest-sha256 }}
          EXPECTED_COMPACTION_MANIFEST_SHA256: ${{ steps.chunks.outputs.compaction-manifest-sha256 }}
          EXPECTED_DIFF_SHA256: ${{ steps.chunks.outputs.diff-sha256 }}
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head-sha }}
          EXPECTED_MERGE_TREE_SHA: ${{ steps.source.outputs.merge-tree-sha }}
          EXPECTED_MODEL: ${{ steps.claude.outputs.model }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REPRESENTATION_SHA256: ${{ steps.chunks.outputs.representation-sha256 }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RESPONSE_TRANSPORT: ${{ steps.claude.outputs.response-transport }}
          EXPECTED_RESPONSE_ARTIFACT_ID: ${{ steps.response_artifact.outputs.artifact-id }}
          EXPECTED_RESPONSE_ARCHIVE_SHA256: ${{ steps.response_artifact.outputs.artifact-digest }}
          EXPECTED_RESPONSE_MANIFEST_BYTES: ${{ steps.claude.outputs.response-manifest-bytes }}
          EXPECTED_RESPONSE_MANIFEST_B64: ${{ steps.claude.outputs.response-manifest-b64 }}
          EXPECTED_RESPONSE_MANIFEST_SHA256: ${{ steps.claude.outputs.response-manifest-sha256 }}
          EXPECTED_WORKFLOW_SHA256: ${{ steps.source.outputs.workflow-sha256 }}
          INJECTION_DETECTED: ${{ steps.claude.outputs.injection-detected }}
          STRUCTURED_VERDICT: ${{ steps.claude.outputs.verdict }}
        run: |
          set -euo pipefail



          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            stage="${CLAUDE_FAILURE_STAGE:-unreported}"
            detail="${CLAUDE_FAILURE_DETAIL:-}"



            if [ -z "${CLAUDE_FAILURE_STAGE:-}" ]; then
              if [[ "${CHUNKS_FAILURE_STAGE:-}" =~ ^chunks-[a-z-]{1,24}$ ]]; then
                stage="$CHUNKS_FAILURE_STAGE"
                detail="${CHUNKS_FAILURE_DETAIL:-}"
              elif [[ "${SOURCE_FAILURE_STAGE:-}" =~ ^source-[a-z-]{1,24}$ ]]; then
                stage="$SOURCE_FAILURE_STAGE"
                detail="${SOURCE_FAILURE_DETAIL:-}"
              fi
            fi



            [[ "$stage" =~ ^[a-z-]{1,32}$ ]] || stage="unreported"






            case "$stage" in
              merit|injection) reported_verdict="${STRUCTURED_VERDICT:-}" ;;
              *) reported_verdict="could-not-review" ;;
            esac
            [[ "$reported_verdict" =~ ^(pass|fail|could-not-review)$ ]] \
              || reported_verdict="could-not-review"
            printf 'adversarial-review-outcome: %s\n' "$reported_verdict" >&2
            case "$stage" in
              merit)
                echo "Adversarial review: REVIEWED AND FAILED on merit." >&2
                echo "The reviewer read this change and objected. The objection is below, and also in the job log and the run summary." >&2
                ;;
              injection)
                echo "Adversarial review: PROMPT INJECTION DETECTED. This is a SECURITY finding about this change." >&2
                echo "The reviewed content was reported as attempting to instruct or manipulate the reviewer. This veto is unconditional and is never re-sampled." >&2
                ;;
              chunk-assertion|aggregate-assertion)
                echo "Adversarial review: the reviewer did NOT reach a verdict; one of its own bounds was exceeded (stage=${stage})." >&2
                echo "This is a reviewer/tooling failure, NOT a finding about this change." >&2
                ;;
              security-scope)
                echo "Adversarial review: the reviewer did NOT reach a verdict; the file paths for the security scope could not be extracted from the chunk manifest (stage=${stage})." >&2
                echo "This is a reviewer/tooling failure, NOT a finding about this change." >&2
                ;;
              context-unresolved)
                echo "Adversarial review: the reviewer did NOT reach a verdict; a chunk depends on code outside it and the one context re-review could not resolve it, or the context did not fit its caps (stage=${stage})." >&2
                echo "This is NOT a finding about this change. The reviewer never repeats the re-review. Split the change so the dependency is reviewed with its implementation, or re-run." >&2
                ;;
              coverage-unresolved)
                echo "Adversarial review: the reviewer did NOT reach a verdict; a chunk reported partial coverage on a security-relevant interface and the one security re-review could not resolve it (stage=${stage})." >&2
                echo "This is NOT a finding about this change, and partial coverage by itself never blocks. Re-run, or split the change so the security-relevant hunk is reviewed with more room." >&2
                ;;
              source-exceeds-admission|chunks-exceeds-admission)
                echo "Adversarial review: the pull request exceeds admission limits (stage=${stage})." >&2
                echo "The reviewer could not reach a verdict. Use an independent review path." >&2
                ;;
              review-time-budget)
                echo "Adversarial review: the reviewer did NOT reach a verdict before its internal time budget (stage=${stage})." >&2
                ;;
              model-access-denied|model-output-incomplete|model-response-shape|model-request-bound|\
              synthesis-transport|synthesis-api-error|synthesis-schema|\
              chunk-transport|chunk-api-error|chunk-schema)
                echo "Adversarial review: the reviewer did NOT reach a verdict; the model call failed or returned nothing usable (stage=${stage})." >&2
                echo "This is an availability failure, NOT a finding about this change. An EMPTY response is this case, never a substantive fail." >&2
                if [ "$stage" = "chunk-api-error" ]; then
                  echo "An HTTP status is printed below. 401 means the reviewer's model credential is absent, empty or unscoped -- check that the OPENAI_API_KEY repository secret exists; 429 means quota or rate limit; 404 usually means the configured model name is not available to this account." >&2
                fi
                ;;
              source-conflicted-merge)
                echo "Adversarial review: the reviewer did NOT reach a verdict; there is no single tree to review (stage=${stage})." >&2
                echo "The head does not merge cleanly into the reviewed base. This is a state of the branch, NOT a finding about this change: merge or rebase the base branch into the pull request branch and push." >&2
                ;;
              source-stale-event)
                echo "Adversarial review: the reviewer did NOT reach a verdict; the base moved after this run was dispatched (stage=${stage})." >&2
                echo "This is an ordinary race, NOT a finding about this change. The next event on this pull request reviews the new base." >&2
                ;;
              source-not-reviewable)
                echo "Adversarial review: the reviewer DECLINED to review (stage=${stage})." >&2
                echo "A draft, or a do-not-merge label. Nothing is wrong with this change and nothing was reviewed. The check is red only because a GitHub Actions job cannot conclude neutral; the notice annotation on the source step carries the disposition." >&2
                ;;
              source-pull-request-rejected|source-acquisition-bound)
                echo "Adversarial review: the reviewer did NOT reach a verdict; the pull request is outside what this reviewer admits (stage=${stage})." >&2
                echo "This is a reviewer/tooling boundary, NOT a finding about this change. Read the source step log above for the clause or the bound that rejected." >&2
                ;;
              # ===== #212 P2 SOURCE-STAGE CLASSIFICATION =====

              source-base-charset|source-default-charset)
                echo "Adversarial review: the reviewer did NOT reach a verdict; a branch name it must resolve is outside the publication branch-name alphabet (stage=${stage})." >&2
                echo "This is a reviewer/tooling boundary, NOT a finding about this change. \`source-base-charset\` is the reviewed base ref, \`source-default-charset\` is the repository default branch. Admission and publication share ONE branch-name alphabet, so a name this reviewer could not publish about is refused before it is ever interpolated into a request rather than reviewed and then silently undeliverable." >&2
                ;;
              source-base-unresolved|source-default-head-unresolved)
                echo "Adversarial review: the reviewer did NOT reach a verdict; a branch head it resolves AUTHORITATIVELY did not resolve (stage=${stage})." >&2
                echo "This is a reviewer/tooling failure, NOT a finding about this change. \`source-base-unresolved\` is the configured non-default base, \`source-default-head-unresolved\` is the repository default branch. Both are read from the repository's own git ref and never from the event payload, so a deleted or renamed branch -- or an API that did not answer -- fails closed here instead of falling back to a payload value that cannot be trusted." >&2
                ;;
              source-stale-reviewer)
                echo "Adversarial review: the reviewer did NOT reach a verdict; the default branch advanced while this run was in flight, so the bytes that ran are no longer canonical (stage=${stage})." >&2
                echo "This is ordinary supersession, NOT a finding about this change: the default branch moved to revoke a base-ref allowlist entry or to ship a reviewer fix, and a superseded reviewer must not report a verdict. The next event on this pull request runs the current reviewer." >&2
                ;;
              # === END #212 P2 SOURCE-STAGE CLASSIFICATION ===
              kill-switch)
                echo "Adversarial review: CANCELLED by the global kill switch (stage=${stage})." >&2
                echo "The reviewer did NOT reach a verdict and did NOT call the model. This is the control working, NOT a finding about this change and NOT a model outage: do not investigate the model endpoint. The detail below says whether the switch read 'off' or could not be read at all -- an unreadable switch is treated as ENGAGED, which is the direction a kill switch has to fail." >&2
                ;;
              source-assertion|source-unclassified|chunks-manifest|chunks-unclassified)
                echo "Adversarial review: the reviewer did NOT reach a verdict; it died before any model call (stage=${stage})." >&2
                echo "This is a reviewer/tooling failure, NOT a finding about this change. The stage names the STEP that died -- \`source-\` is 'Materialize complete immutable pull request data', \`chunks-\` is 'Build bounded complete review chunks' -- so expand that step, not the model step." >&2
                ;;
              *)
                echo "Adversarial review: the review step failed without a verdict (stage=${stage})." >&2
                echo "No verdict was recorded. Read the review step log above." >&2
                ;;
            esac
            printf 'structured verdict: %s\n' "$reported_verdict" >&2
            printf 'reviewer model: %s\n' "${EXPECTED_MODEL:-<none recorded>}" >&2
            if [ -n "${detail:-}" ] \
              && [[ "$detail" =~ ^[A-Za-z0-9_=/.,\ -]{1,200}$ ]]; then
              printf 'failure detail: %s\n' "$detail" >&2
            else
              printf 'failure detail: %s\n' "<none recorded>" >&2
            fi



            if [ -n "${CLAUDE_OBJECTION_B64:-}" ] \
              && [[ "$CLAUDE_OBJECTION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
              && [ "${#CLAUDE_OBJECTION_B64}" -le 60000 ]; then
              echo "--- reviewer objection ---" >&2
              printf '%s' "$CLAUDE_OBJECTION_B64" | base64 -d 2>/dev/null \
                | head -c 8192 | tr -cd '\11\12\40-\176' >&2 || true
              echo "--- end reviewer objection ---" >&2
            else
              echo "No objection was recorded, which means no verdict was reached." >&2
            fi








            if { [ "$stage" = "merit" ] || [ "$stage" = "injection" ]; } \
              && [ -n "${GITHUB_OUTPUT:-}" ] && [ ! -L "$GITHUB_OUTPUT" ] \
              && [ "$STRUCTURED_VERDICT" = "fail" ] \
              && [[ "$EXPECTED_BASE_REF" =~ ^[A-Za-z0-9._/-]{1,512}$ ]] \
              && [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$EXPECTED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              && [[ "$EXPECTED_MODEL" == "${RESPONSE_MODEL:-}" ]] \
              && [[ "${RESPONSE_MODEL:-}" =~ ^gpt-6-luna$ ]] \
              && [[ "$CLAUDE_OBJECTION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
              && [ "${#CLAUDE_OBJECTION_B64}" -le 60000 ]; then
              {
                echo "failure-stage=$stage"
                echo "objection-b64=$CLAUDE_OBJECTION_B64"
                echo "reviewed-base-ref=$EXPECTED_BASE_REF"
                echo "reviewed-base-sha=$EXPECTED_BASE_SHA"
                echo "reviewed-head-sha=$EXPECTED_HEAD_SHA"
                echo "reviewed-model=$EXPECTED_MODEL"
                echo "reviewed-workflow-sha256=$EXPECTED_WORKFLOW_SHA256"
                echo "verdict=$STRUCTURED_VERDICT"
              } >> "$GITHUB_OUTPUT"
            elif [ "$reported_verdict" = "could-not-review" ] \
              && [ -n "${GITHUB_OUTPUT:-}" ] && [ ! -L "$GITHUB_OUTPUT" ]; then


              printf 'verdict=%s\n' "$reported_verdict" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          test "$EXPECTED_BASE_REF" = "$(git check-ref-format --branch "$EXPECTED_BASE_REF")"
          test "$(printf '%s' "$EXPECTED_BASE_REF" | wc -c)" -le 512
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CHUNK_COUNT" =~ ^[1-9][0-9]*$ ]]
          test "$EXPECTED_CHUNK_COUNT" -le 96
          [[ "$EXPECTED_CHUNK_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_COMPACTION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_DIFF_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MERGE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MODEL" == "${RESPONSE_MODEL:-}" ]]
          [[ "${RESPONSE_MODEL:-}" =~ ^gpt-6-luna$ ]]
          [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REPRESENTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RESPONSE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          response_manifest="$RUNNER_TEMP/verified-response-manifest.json"
          transcript_gzip="$RUNNER_TEMP/verified-review-transcript.gz"
          transcript="$RUNNER_TEMP/verified-review-transcript.txt"
          ledger="$RUNNER_TEMP/verified-interface-ledger.json"
          # BEGIN PROTECTED CONTEXT ADJUDICATION HELPER
          python3 - "$response_manifest" <<'PY'
