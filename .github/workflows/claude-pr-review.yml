                printf 'Missing-context re-review CONFIRMED a defect: chunk %s/%s\n' "$index" "$chunk_count" >&2
                adjudication_extra_tokens=$((adjudication_extra_tokens + $(jq -er .usage.completion_tokens "$response") - $(jq -er .usage.completion_tokens "$adjudication_response")))
                cp -- "$adjudication_response" "$response"
                cp -- "$context_capsule" "$context_shown/$(printf '%04d' "$index").txt"
                if [ "$(jq -er '.files | length' "$context_tree")" -gt 0 ]; then tree_redact=1; fi
                break
              elif jq -e '
                (.verdict == "fail" or (.verdict == "pass" and .coverage_complete == false)) and .injection_detected == false
                and (.missing_context | length) > 0
              ' "$context_secondary" >/dev/null; then
                if [ "$context_round" -eq 4 ]; then context_unresolved "continuation-round-budget"; fi
                context_next="$RUNNER_TEMP/context-next-${index}.json"
                cp -- "$context_secondary" "$context_next"
                context_previous="$context_tree"
                continue
              elif python3 "$context_helper" decision "$context_bundle" "$context_primary" \
                "$context_secondary" "$chunk_context" "$context_records/$(printf '%04d' "$index").json" \
                "$context_tree" "$security_flag" "$retention_helper" \
                "${adjudication_response}.wire-request" "${adjudication_response}.raw" "$RUNNER_TEMP"; then
                context_rereviews_cleared=$((context_rereviews_cleared + 1))
                adjudication_extra_tokens=$((adjudication_extra_tokens + $(jq -er .usage.completion_tokens "$response") - $(jq -er .usage.completion_tokens "$adjudication_response")))
                cp -- "$adjudication_response" "$response"
                cp -- "$context_capsule" "$context_shown/$(printf '%04d' "$index").txt"
                if [ "$(jq -er '.files | length' "$context_tree")" -gt 0 ]; then tree_redact=1; fi
                printf 'Missing-context objection resolved by new source evidence: chunk %s/%s\n' \
                  "$index" "$chunk_count" >&2
                break
              else
                printf 'Missing-context objection remains: chunk %s/%s; additional response %s\n' \
                  "$index" "$chunk_count" "$(jq -r '"verdict=" + .verdict + " summary=" + .summary' "$context_secondary")" >&2
                context_unresolved "rereview-still-inconclusive"
              fi
              done
            fi
